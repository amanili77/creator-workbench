<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090b0c">
    <title>创作者工作台 · 空间模式</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230d1717'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' fill='%2379d9ca'%3E%E6%9C%AC%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css?v=20260804-todo-monitor">
</head>
<body>
    <main id="experience" class="experience" data-focus="" aria-label="创作者工作台空间模式">
        <div id="loader" class="loader" aria-live="polite">
            <div class="loader-mark"><i></i><i></i><i></i></div>
            <strong>正在进入空间模式</strong>
            <span id="loadPercent">0%</span>
        </div>

        <header class="topbar">
            <div class="topbar-actions">
                <span class="pilot-badge"><i></i>全部模块已接入</span>
                <button id="soundToggle" class="glass-button sound-button" type="button" aria-pressed="false">
                    <i></i><span>环境音关闭</span>
                </button>
                <button id="resetView" class="glass-button" type="button">回到全景</button>
                <a class="glass-button classic-mode-link" href="/">返回经典模式</a>
            </div>
        </header>

        <section id="viewport" class="viewport" aria-label="可交互书桌场景">
            <div id="scene" class="scene">
                <img id="sceneImage" class="scene-image" src="assets/desk-scene-v2-clean.png?v=20260804-todo-monitor" alt="一张放有电脑、书、收音机、相机和手办的写实书桌">
                <button id="deskMonitor" class="desk-monitor" type="button" data-object="weekly" aria-label="打开今日待办">
                    <span class="desk-monitor-head">
                        <span><small>TODAY</small><strong id="deskMonitorDate">今日待办</strong></span>
                        <time id="deskMonitorClock">--:--</time>
                    </span>
                    <span id="deskMonitorBody" class="desk-monitor-body">
                        <span class="desk-monitor-empty">正在读取今日安排…</span>
                    </span>
                    <span class="desk-monitor-foot">
                        <span id="deskMonitorProgress">本周进度 0%</span>
                        <i><b id="deskMonitorProgressBar"></b></i>
                        <em>点击管理周计划</em>
                    </span>
                </button>
                <div class="monitor-reflection" aria-hidden="true"></div>
                <div class="warm-light" aria-hidden="true"></div>
                <div class="cursor-light" aria-hidden="true"></div>
                <div class="film-grain" aria-hidden="true"></div>

                <div class="effect effect-book" aria-hidden="true"><i></i><i></i></div>
                <div class="effect effect-radio" aria-hidden="true"><span>FM&nbsp; 98.6</span><i></i><i></i><i></i></div>
                <div class="effect effect-camera" aria-hidden="true"><i></i><i></i><i></i></div>
                <div class="effect effect-notebook" aria-hidden="true"><i></i><i></i><i></i></div>
                <div class="effect effect-calendar" aria-hidden="true"><span>THIS WEEK</span><i></i></div>
                <div class="effect effect-safe" aria-hidden="true"><i></i><span>LOCAL ONLY</span></div>
                <div class="effect effect-xiaoli" aria-hidden="true"><i></i><i></i><span></span></div>
            </div>

            <button class="hotspot is-live" type="button" data-object="weekly" style="--x: 8.5%; --y: 65%;" aria-label="打开日历，查看周计划">
                <span class="hotspot-ring"><i></i></span><b>日历 · 周计划</b>
            </button>
            <button class="hotspot is-live" type="button" data-object="radio" style="--x: 24%; --y: 55%;" aria-label="打开收音机，查看今日新闻">
                <span class="hotspot-ring"><i></i></span><b>收音机 · 今日新闻</b>
            </button>
            <button class="hotspot is-live" type="button" data-object="inspirations" style="--x: 25%; --y: 76%;" aria-label="打开相机，查看灵感流">
                <span class="hotspot-ring"><i></i></span><b>相机 · 灵感流</b>
            </button>
            <button class="hotspot is-live" type="button" data-object="archive" style="--x: 51%; --y: 78%;" aria-label="打开书本，查看我的资料库">
                <span class="hotspot-ring"><i></i></span><b>书本 · 我的资料库</b>
            </button>
            <button class="hotspot is-live" type="button" data-object="assistant" style="--x: 70.5%; --y: 56%;" aria-label="点击手办，和助手对话">
                <span class="hotspot-ring"><i></i></span><b><span data-assistant-name>小助手</span> · 私人助手</b>
            </button>
            <button class="hotspot is-live" type="button" data-object="memo" style="--x: 90.5%; --y: 68%;" aria-label="打开铁盒，查看备忘录">
                <span class="hotspot-ring"><i></i></span><b>铁盒 · 备忘录</b>
            </button>
            <button class="hotspot is-live" type="button" data-object="topics" style="--x: 82%; --y: 82%;" aria-label="打开笔记本，查看选题与脚本">
                <span class="hotspot-ring"><i></i></span><b>笔记本 · 选题与脚本</b>
            </button>
        </section>

        <aside id="panel" class="object-panel" aria-hidden="true" aria-live="polite">
            <button id="panelClose" class="panel-close" type="button" aria-label="关闭">×</button>
            <div class="panel-sequence"><span id="panelNumber">01</span><i></i><small>01</small></div>
            <span id="panelKicker" class="panel-kicker">DAILY SIGNAL</span>
            <h2 id="panelTitle">今日新闻</h2>
            <p id="panelDescription">先听最重要的内容，需要时再进入“今天”。</p>
            <div id="panelDemo" class="panel-demo"></div>
            <div class="panel-actions">
                <a id="openFeature" class="panel-primary" href="/?tab=hotspots"><span>打开今天</span></a>
                <button id="primaryAction" class="panel-secondary" type="button">主要操作</button>
                <button id="secondaryAction" class="panel-secondary" type="button">刷新</button>
            </div>
            <button id="panelReset" class="panel-reset" type="button">返回全景</button>
            <p class="prototype-note"><i></i>本地接口已连接 · 数据只保存在这台电脑</p>
        </aside>

        <div id="xiaoliSpeech" class="xiaoli-speech" role="status">
            <span data-assistant-name>小助手</span>
            <p>桌面上的物件都已经接入。点一下，我带你进入对应内容。</p>
        </div>

        <div id="spaceToast" class="space-toast" role="status" aria-live="polite"></div>

        <footer class="statusbar">
            <span><i></i>SPACE MODE · LOCAL WORKSPACE</span>
            <span class="status-line"></span>
            <span>ESC 返回全景</span>
        </footer>
    </main>
    <script src="app.js?v=20260804-todo-monitor"></script>
</body>
</html>
